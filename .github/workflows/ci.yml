name: Regenerate 10k checkpoint

on: workflow_dispatch

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc mesa-vulkan-drivers vulkan-validationlayers xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev xvfb xauth
          python -m pip install ./playtest
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target UrbanSimCore-playtest UrbanSimCore-cli
      - name: Earn and validate the checkpoint
        env:
          XDG_SESSION_TYPE: x11
          LP_NUM_THREADS: '2'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python playtest/examples/balanced_native_journey.py --executable build/bin/UrbanSimCore-playtest --calibration
      - name: Make the validated checkpoint portable
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path("playtest-artifacts/balanced-journey")
          session_path, = root.glob("*/sustainable-ten-thousand.json")
          city_path = session_path.with_suffix(".city.json")
          session = json.loads(session_path.read_text())
          city = json.loads(city_path.read_text())
          population = sum(group["size"] for group in city["populationGroups"])
          assert population >= 10000, population
          evidence = session_path.parent
          assert json.loads((evidence / "result.json").read_text())["complete"]
          output = Path("checkpoint")
          output.mkdir()
          session["citySnapshot"] = city_path.name
          (output / session_path.name).write_text(json.dumps(session, indent=2))
          shutil.copyfile(city_path, output / city_path.name)
          for name in ("build-identity.json", "result.json", "sustainability.json", "continuation.json"):
              shutil.copyfile(evidence / name, output / name)
          print(f"Population: {population}; tick: {session['tick']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: earned-10k-checkpoint
          path: checkpoint/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checkpoint-diagnostics
          path: playtest-artifacts/
