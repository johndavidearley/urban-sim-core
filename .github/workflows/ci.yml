name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: Strict (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build-ci
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DURBAN_SIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test
        run: ctest --test-dir build-ci --parallel 4 --output-on-failure

  asan-ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DURBAN_SIM_WARNINGS_AS_ERRORS=ON
          -DURBAN_SIM_ENABLE_ASAN_UBSAN=ON

      - name: Build
        run: cmake --build build-sanitized --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --parallel 4 --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DURBAN_SIM_WARNINGS_AS_ERRORS=ON
          -DURBAN_SIM_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build-tsan --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: ctest --test-dir build-tsan --parallel 4 --output-on-failure
